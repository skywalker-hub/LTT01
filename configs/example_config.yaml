# ==================== 项目与路径 ====================
project: LT_Tuning                          # wandb 项目名称
name: example                               # 实验名称，用于 wandb run name 和模型保存子目录
save_path: models                           # 模型保存的根目录（最终路径 = save_path/name）
save_dataset: true                          # 是否保存处理后的训练数据集到磁盘
dataset_save_path: ../data/gsm8k            # 处理后数据集的保存路径
train_path: data/gsm8k/train_socratic.jsonl # 训练数据文件路径
val_path: data/gsm8k/test_socratic.jsonl    # 验证数据文件路径

# ==================== 模型 ====================
model_name_or_path: ../Llama-3.2-1B-Instruct # 基础模型路径（HuggingFace 格式）
load_model_path: null                       # 加载已有 checkpoint 的路径（null = 从头训）
use_flash_attention: true                   # 是否使用 Flash Attention 2 加速注意力计算

# ==================== 运行模式 ====================
only_eval: false                            # true = 只跑评估不训练
dihr: true                                  # 是否启用 DIHR（Dynamic Insertion for Hidden Reasoning）
no_thoughts: false                          # true = 完全禁用 <thinking> 机制，做纯 CoT 基线

# ==================== 三阶段课程学习 ====================
stage_epochs:                               # 每个阶段持续的 epoch 数（总和须等于 num_train_epochs）
- 1                                         #   stage0: 显式 CoT 预热
- 1                                         #   stage1: 隐藏状态嵌入
- 1                                         #   stage2: 上下文-预测融合
labels_per_stage:                           # 每个阶段中参与 loss 计算的 <thinking> 标记数量
- 0                                         #   stage0: 不插入 <thinking>，无需计算
- 10                                        #   stage1: 10 个
- 16                                        #   stage2: 16 个
stage_names:                                # 每个阶段的标签名（用于日志和 wandb 显示）
- stage0-cot
- stage1-hidden-state
- stage2-soft-fusion
stage_modes:                                # 每个阶段的模型运行模式
- common                                    #   stage0: 标准 SFT，不用 <thinking> 机制
- hidden_state                              #   stage1: 用前一位置隐藏状态替代 <thinking> 嵌入
- soft_fusion                               #   stage2: 融合隐藏状态 + 预测分布嵌入
eval_stage_mode: soft_fusion                # 评估时使用的阶段模式

# ==================== <thinking> 标记配置 ====================
thinking_token: <thinking>                  # 潜在推理占位符的标记文本
use_unk_for_thinking: false                 # true = 复用 tokenizer 的 unk_token 作为 <thinking>（不新增词表）
thinking_strategy: confidence               # <thinking> 插入策略: confidence（置信度）/ arithmetic / random
thinking_hidden_state_layer: -1             # 提取隐藏状态的 Transformer 层索引（-1 = 最后一层）
thinking_insertion_prob:                    # 在候选位置实际插入 <thinking> 的概率（按阶段）
- 0.0                                       #   stage0: 不插入
- 0.85                                      #   stage1: 85% 概率插入
- 0.95                                      #   stage2: 95% 概率插入
thinking_secondary_insertion_prob:          # 在同一位置连续插入第二个 <thinking> 的概率（按阶段）
- 0.0                                       #   stage0: 不插入
- 0.15                                      #   stage1: 15%
- 0.2                                       #   stage2: 20%
thinking_operator_regex: '[0-9]+|[+\-*/=]'  # arithmetic 策略用的正则，匹配数字和运算符位置
thinking_prompt_tokens: 0                   # <thinking> 前插入的额外提示 token 数量

# ==================== MLP 变换（可选） ====================
thinking_use_mlp: false                     # 是否用 MLP 变换隐藏状态（false = 直接用原始隐藏状态）
thinking_mlp_hidden_dim: 1024               # MLP 隐藏层维度
thinking_mlp_activation: gelu               # MLP 激活函数

# ==================== 置信度策略阈值 ====================
reinforce_prob_threshold:                   # 论文公式(5)的阈值 τ：p(y_t|y<t) < τ 时插入 <thinking>
- 0.0                                       #   stage0: 不使用
- 0.3                                       #   stage1: 预测概率 < 30% 视为低置信度
- 0.2                                       #   stage2: 预测概率 < 20% 视为低置信度
reinforce_max_eval_length: 2048             # 计算置信度时序列的最大长度

# ==================== 融合参数（stage2） ====================
fusion_alpha:                               # 公式(7) e_fusion = α·h + (1-α)·e_pred 中的 α
- 0.5                                       #   stage0: 不使用（但需占位）
- 0.5                                       #   stage1: 不使用（但需占位）
- 0.6                                       #   stage2: 隐藏状态权重 60%，预测嵌入权重 40%
fusion_top_p: 0.9                           # 公式(6) 计算 e_pred 时的 Top-p 过滤阈值
fusion_temperature: 1.0                     # 公式(6) logits 的温度缩放参数

# ==================== Checkpoint 与恢复 ====================
resume: 0                                   # 从第几个 epoch 恢复训练（0 = 从头开始）
reset_optimizer: false                      # 恢复训练时是否重置优化器状态
save_only_improve: false                    # true = 只在验证指标提升时保存 checkpoint
max_epoch_checkpoints: 5                    # 最多保留多少个 epoch 级别的 checkpoint
max_step_checkpoints: null                  # 最多保留多少个 step 级别的 checkpoint（null = 不按步保存）
save_every_n_steps: 0                       # 每隔多少步保存一次（0 = 不按步保存）

# ==================== HuggingFace Trainer 训练参数 ====================
output_dir: models/example_exp              # HF Trainer 的输出目录（会被 save_path/name 覆盖）
per_device_train_batch_size: 4              # 每张 GPU 的训练 batch size
per_device_eval_batch_size: 4               # 每张 GPU 的评估 batch size
gradient_accumulation_steps: 1              # 梯度累积步数（等效 batch = batch_size × GPU数 × 此值）
num_train_epochs: 3                         # 总训练 epoch 数（须等于 stage_epochs 之和）
save_total_limit: 2                         # HF Trainer 最多保留的 checkpoint 数量
remove_unused_columns: true                 # 是否自动移除模型不需要的数据列
learning_rate: 5.0e-05                      # 学习率
weight_decay: 0.01                          # 权重衰减
warmup_ratio: 0.05                          # 学习率预热比例（前 5% 的步数做线性预热）
bf16: true                                  # 是否使用 bfloat16 混合精度训练
logging_steps: 10                           # 每隔多少步打印一次训练日志（loss 等）
save_strategy: epoch                        # checkpoint 保存策略：epoch / steps / no
eval_strategy: stage                        # 评估策略：stage（每阶段结束评估）/ epoch（每轮评估）/ no（仅最后评估）
report_to: wandb                            # 日志上报平台：wandb / tensorboard / none
seed: 42                                    # 随机种子（控制数据 shuffle、模型初始化等）
datasets:                                   # 数据集标识（当前未在代码中实际使用）
- MultiArith
deepspeed: configs/ds_config_zero2.json     # DeepSpeed 配置文件路径（ZeRO-2 优化显存）
